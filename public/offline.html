<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#022b26">
    <title>Tidak ada koneksi · SIMAGTI</title>
    <link rel="icon" type="image/svg+xml" href="/images/logo-simagti-mark.svg">
    <!--
        Halaman offline PWA (ditampilkan service worker saat jaringan putus). Harus berdiri sendiri:
        gaya disalin dari halaman status (.st-* di kp.css), tanpa font atau CSS dari jaringan.
        Otomatis memuat ulang begitu koneksi kembali.
    -->
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            position: relative; min-height: 100vh; min-height: 100dvh;
            display: grid; grid-template-rows: auto 1fr; padding: 28px clamp(20px, 5vw, 56px) 40px;
            color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow-x: hidden;
            background:
                radial-gradient(60% 55% at 50% 0%, rgba(197, 240, 74, .16), transparent 70%),
                radial-gradient(45% 60% at 100% 100%, rgba(108, 192, 42, .25), transparent 70%),
                linear-gradient(165deg, #0e3b33 0%, #022b26 100%);
        }
        body::before {
            content: ""; position: fixed; inset: 0; pointer-events: none;
            background-image: radial-gradient(rgba(255, 255, 255, .07) 1px, transparent 1px); background-size: 24px 24px;
            -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%); mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
        }
        header { position: relative; z-index: 1; }
        .brand { display: inline-flex; align-items: center; gap: 10px; color: #fff; font-size: 16px; font-weight: 750; letter-spacing: .01em; }
        .brand img { display: block; width: 30px; height: 30px; padding: 5px; border-radius: 9px; background: #fff; box-shadow: 0 6px 16px rgba(0, 0, 0, .25); }
        main { position: relative; z-index: 1; align-self: center; justify-self: center; width: 100%; max-width: 560px; text-align: center; }
        .big { display: inline-grid; place-items: center; width: 136px; height: 136px; color: rgba(197, 240, 74, .7); }
        .big svg { width: 100%; height: 100%; }
        .big svg path { vector-effect: non-scaling-stroke; }
        h1 { margin: 18px 0 0; font-size: clamp(26px, 4vw, 34px); font-weight: 750; letter-spacing: -0.03em; line-height: 1.15; }
        p { margin: 10px auto 0; max-width: 40ch; color: rgba(255, 255, 255, .7); font-size: 15.5px; line-height: 1.6; }
        .actions { display: flex; flex-direction: column; align-items: center; gap: 18px; margin-top: 28px; }
        button {
            height: 48px; padding: 0 26px; border: 0; border-radius: 999px; cursor: pointer;
            background: #c5f04a; color: #03231f; font: inherit; font-size: 15px; font-weight: 700;
            box-shadow: 0 12px 30px -10px rgba(197, 240, 74, .55); transition: transform .15s, background-color .15s;
        }
        button:hover { background: #d6f582; transform: translateY(-1px); }
        button:focus-visible { outline: 3px solid rgba(197, 240, 74, .6); outline-offset: 3px; }
        .wait { display: inline-flex; align-items: center; gap: 8px; color: rgba(255, 255, 255, .65); font-size: 13.5px; }
        .wait::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #c5f04a; box-shadow: 0 0 0 4px rgba(197, 240, 74, .18); animation: blink 1.6s ease-in-out infinite; }
        @keyframes blink { 50% { opacity: .35; } }
        @media (prefers-reduced-motion: reduce) { .wait::before { animation: none; } button { transition: none; } }
    </style>
</head>
<body>
<header>
    <span class="brand"><img src="/images/logo-simagti-mark.svg" alt="">SIMAGTI</span>
</header>
<main>
    <span class="big" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 5-2.7M19 13a10 10 0 0 0-2.2-1.6M2 9.5a15 15 0 0 1 4.3-2.8M22 9.5a15 15 0 0 0-11.3-3.9M12 20h.01"/></svg>
    </span>
    <h1>Tidak ada koneksi</h1>
    <p>Periksa internet, lalu coba lagi.</p>
    <div class="actions">
        <span class="wait" aria-live="polite">Menunggu koneksi</span>
        <button type="button" onclick="location.reload()">Coba lagi</button>
    </div>
</main>
<script>
    // Muat ulang otomatis begitu koneksi kembali
    window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
