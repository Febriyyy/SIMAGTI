<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#037a68">
    <title>Tidak ada koneksi · SIMAGTI</title>
    <link rel="icon" type="image/svg+xml" href="/images/logo-simagti-mark.svg">
    <style>
        :root { --primary: #037a68; --text: #142b29; --muted: #5d706d; --line: #d4dfdc; --page: #f3f5f0; --lime: #c9f065; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body { display: grid; place-items: center; padding: 24px; background: var(--page); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
        main { width: 100%; max-width: 380px; padding: 36px 28px; border-radius: 28px; background: #fff; box-shadow: 0 0 0 1px var(--line); text-align: center; }
        img { width: 56px; height: 56px; }
        h1 { margin: 18px 0 6px; font-size: 22px; letter-spacing: -0.02em; }
        p { margin: 0; color: var(--muted); line-height: 1.55; font-size: 15px; }
        button { margin-top: 22px; min-height: 44px; padding: 0 22px; border: 0; border-radius: 999px; background: var(--primary); color: #fff; font: 600 15px/1 inherit; cursor: pointer; }
        button:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }
    </style>
</head>
<body>
<main>
    <img src="/images/logo-simagti-mark.svg" alt="">
    <h1>Tidak ada koneksi</h1>
    <p>SIMAGTI butuh internet untuk memuat data magangmu. Periksa koneksi, lalu coba lagi.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
</main>
</body>
</html>
